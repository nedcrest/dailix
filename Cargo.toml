[workspace]
members = ["crates/sheet", "crates/dailix"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: a file read and written back keeps its keys' order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
schemars = { version = "1.2.3", features = ["preserve_order", "indexmap2"] }
clap = { version = "4.6.7", features = ["derive"] }
iced = { version = "0.14.0", features = ["advanced", "advanced-shaping", "image"] }
rfd = "0.17.2"
