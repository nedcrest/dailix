[package]
name = "dailix"
version = "0.1.0"
description = "Bringing footage in and choosing it: the contact sheet, then the archive and an Omnix project"
edition.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
iced.workspace = true
rfd.workspace = true
# Omnix's player (its `viewer`), the same the bin plays clips with, and
# the contact sheet's core both programs share: both live in Omnix's repo.
# Building Omnix needs ALSA's headers.
omnix = { path = "../../../omnix-360-studio" }
dailix-sheet = { path = "../../../omnix-360-studio/crates/sheet" }
schemars.workspace = true
# The system's trash, for what tidying takes away (as Omnix's bin).
trash = { version = "5", default-features = false }
# When a video was last changed, in local time (the same as Omnix's).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
blake3 = { version = "1", default-features = false, features = ["std"] }

# Free space on a disk (statvfs), for the home view's places.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
