[package]
name = "dailix"
version = "0.1.0"
description = "Bringing footage in and choosing it: the contact sheet, then the archive and an Omnix project"
edition.workspace = true
license.workspace = true

[dependencies]
dailix-sheet = { path = "../sheet" }
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
iced.workspace = true
rfd.workspace = true
# Omnix's player (its `viewer`), the same the bin plays clips with; a
# sibling repo, as Omnix depends on this one's sheet core. Building it
# needs ALSA's headers (Omnix's own .localdeps on the dev machine).
omnix = { path = "../../../omnix-360-studio" }
schemars.workspace = true
# The system's trash, for what tidying takes away (as Omnix's bin).
trash = { version = "5", default-features = false }

# Free space on a disk (statvfs), for the home view's places.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
