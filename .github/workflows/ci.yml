# Every push and pull request: Dailix builds against Omnix and the sheet
# core, checked out beside it as on a developer's machine
# (`../omnix-360-studio`, its main branch), its tests pass and clippy reads
# it. The Omnix repo is the owner's `omnix-360-studio` unless the repo
# variable OMNIX_REPO says otherwise; while it's private, a read-only
# token for it goes in the secret OMNIX_TOKEN.
name: CI

# Not for a change to the docs or the agent's skills alone (the free
# Actions minutes: the user, 2026-11-15); by hand for anything.
on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: dailix
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.OMNIX_REPO || format('{0}/omnix-360-studio', github.repository_owner) }}
          token: ${{ secrets.OMNIX_TOKEN || github.token }}
          path: omnix-360-studio
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dailix
      - name: Build
        working-directory: dailix
        run: cargo build --locked --all-targets
      - name: Test
        working-directory: dailix
        run: cargo test --locked
      - name: Clippy
        working-directory: dailix
        run: cargo clippy --locked --all-targets
